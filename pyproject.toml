[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vibe99ctl"
version = "0.1.0"
description = "Open-source terminal driver for the Mechlands Vibe99 keyboard: RGB, integrated screen and clock, no proprietary GUI required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrea Brescia" }]
keywords = [
    "mechlands",
    "vibe99",
    "keyboard",
    "hid",
    "rgb",
    "tft",
    "cli",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Human Interface Device (HID)",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "Pillow>=10.0",
    "hidapi>=0.14",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
# Heavy media backends are optional: only needed for animation/video conversion.
media = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]
# Full media stack including OpenCV for advanced frame extraction.
media-full = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "opencv-python-headless>=4.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Frumorn12/vibe99ctl"
Repository = "https://github.com/Frumorn12/vibe99ctl"
Issues = "https://github.com/Frumorn12/vibe99ctl/issues"
Documentation = "https://github.com/Frumorn12/vibe99ctl/tree/main/docs"

[project.scripts]
vibe99 = "vibe99.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe99"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008", # function calls in argument defaults (Typer uses this pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
